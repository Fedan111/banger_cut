<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banger Cut — Редактор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--tg-theme-button-color, #3390ec);
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        #session-info {
            font-size: 13px;
            opacity: 0.7;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>✏️ Редактор субтитров</h2>
        <div id="session-info">Загрузка сессии...</div>

        <div class="card" id="editor-content">
            <p>Здесь будет отображаться список распознанных фраз и таймкоды для редактирования.</p>
        </div>

        <button class="btn" onclick="saveChanges()">Сохранить и смонтировать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        const sessionInfoEl = document.getElementById('session-info');
        if (sessionId) {
            sessionInfoEl.innerText = `ID сессии: ${sessionId}`;
        } else {
            sessionInfoEl.innerText = `Ошибка: ID сессии не передан в URL.`;
        }

        function saveChanges() {
            tg.showAlert("Изменения сохранены!");
            // Здесь добавьте вызов вашего API или Supabase SDK для сохранения
        }
    </script>
</body>
</html>
