<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banger Cut — Редактор субтитров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --destructive-color: #ff453a;
            --success-color: #30d158;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header {
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header p {
            font-size: 13px;
            color: var(--hint-color);
            margin: 0;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            gap: 12px;
            color: var(--hint-color);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--button-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .video-container {
            position: relative;
            margin-bottom: 16px;
            width: 100%;
        }

        .video-player {
            width: 100%;
            max-height: 260px;
            border-radius: 12px;
            background-color: #000;
            display: block;
            object-fit: contain;
        }

        /* Оверлей субтитров поверх видео */
        .subtitle-overlay {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            max-width: 85%;
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .word-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background-color: var(--secondary-bg);
            padding: 16px;
            border-radius: 14px;
            line-height: 1.6;
        }

        .word-chip {
            display: inline-flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .word-chip:active {
            transform: scale(0.96);
        }

        .word-chip.disabled {
            opacity: 0.35;
            text-decoration: line-through;
            background-color: transparent;
            border-color: transparent;
        }

        .word-chip input {
            background: transparent;
            border: none;
            color: inherit;
            font-size: inherit;
            font-family: inherit;
            outline: none;
            width: auto;
            min-width: 20px;
            text-align: center;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--hint-color);
            margin-top: 12px;
            padding: 0 4px;
        }

        .error-card {
            background-color: rgba(255, 69, 58, 0.1);
            border: 1px solid var(--destructive-color);
            color: var(--destructive-color);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✏️ Редактор субтитров</h1>
        <p>Нажмите на слово, чтобы включить/выключить его из монтажа. Нажмите на текст, чтобы отредактировать слово.</p>
    </div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <span>Загрузка транскрипта...</span>
    </div>

    <div id="editor-container" style="display: none;">
        <div class="video-container">
            <video id="video-player" class="video-player" controls playsinline preload="metadata">
                <source id="video-source" src="" type="video/mp4">
                Ваш браузер не поддерживает просмотр видео.
            </video>
            <div id="subtitle-overlay" class="subtitle-overlay"></div>
        </div>

        <div class="word-grid" id="word-grid"></div>
        <div class="stats-bar">
            <span id="words-count">Всего слов: 0</span>
            <span id="active-count">В видео: 0</span>
        </div>
    </div>

    <div id="error-container" class="error-card" style="display: none;"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        let wordsData = [];
        let keepSegments = [];

        const videoPlayer = document.getElementById('video-player');
        const subtitleOverlay = document.getElementById('subtitle-overlay');

        async function loadSession() {
            if (!sessionId) {
                showError("ID сессии отсутствует в URL");
                return;
            }

            try {
                const response = await fetch(`/api/session/${sessionId}`);
                const data = await response.json();

                if (!response.ok || data.status !== 'ok') {
                    throw new Error(data.detail || 'Не удалось загрузить данные сессии');
                }

                const session = data.session;
                wordsData = session.transcript || [];
                keepSegments = session.keep_segments || [];

                wordsData.forEach(word => {
                    word.active = isTimeInKeepSegments(word.start, word.end, keepSegments);
                });

                const videoSource = document.getElementById('video-source');
                videoSource.src = `/api/session/${sessionId}/video`;
                videoPlayer.load();

                renderWords();
                setupMainButton();
                setupSubtitleSync();

                document.getElementById('loader').style.display = 'none';
                document.getElementById('editor-container').style.display = 'block';

            } catch (err) {
                showError(err.message);
            }
        }

        function isTimeInKeepSegments(start, end, segments) {
            if (!segments || segments.length === 0) return true;
            return segments.some(seg => (start >= seg.start && start <= seg.end) || (end >= seg.start && end <= seg.end));
        }

        function setupSubtitleSync() {
            videoPlayer.addEventListener('timeupdate', () => {
                const currentTime = videoPlayer.currentTime;
                const currentWord = wordsData.find(w => w.active && currentTime >= w.start && currentTime <= w.end);

                if (currentWord && currentWord.word.trim()) {
                    subtitleOverlay.innerText = currentWord.word;
                    subtitleOverlay.style.display = 'block';
                } else {
                    subtitleOverlay.style.display = 'none';
                }
            });
        }

        function renderWords() {
            const grid = document.getElementById('word-grid');
            grid.innerHTML = '';

            let activeCount = 0;

            wordsData.forEach((item, index) => {
                if (item.active) activeCount++;

                const chip = document.createElement('div');
                chip.className = `word-chip ${item.active ? '' : 'disabled'}`;
                
                const input = document.createElement('input');
                input.value = item.word;
                input.size = Math.max(item.word.length, 1);
                
                input.addEventListener('input', (e) => {
                    wordsData[index].word = e.target.value;
                    input.size = Math.max(e.target.value.length, 1);
                });

                chip.addEventListener('click', (e) => {
                    if (e.target === input) return;
                    wordsData[index].active = !wordsData[index].active;
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                    renderWords();
                });

                chip.appendChild(input);
                grid.appendChild(chip);
            });

            document.getElementById('words-count').innerText = `Всего слов: ${wordsData.length}`;
            document.getElementById('active-count').innerText = `В видео: ${activeCount}`;
        }

        function setupMainButton() {
            tg.MainButton.setText("СОХРАНИТЬ И СМОНТИРОВАТЬ");
            tg.MainButton.show();
            tg.MainButton.onClick(saveChanges);
        }

        async function saveChanges() {
            tg.MainButton.showProgress();

            const activeWords = wordsData.filter(w => w.active);
            const newKeepSegments = [];

            if (activeWords.length > 0) {
                let currentSeg = { start: activeWords[0].start, end: activeWords[0].end };
                for (let i = 1; i < activeWords.length; i++) {
                    const w = activeWords[i];
                    if (w.start - currentSeg.end <= 0.4) {
                        currentSeg.end = w.end;
                    } else {
                        newKeepSegments.push({ ...currentSeg });
                        currentSeg = { start: w.start, end: w.end };
                    }
                }
                newKeepSegments.push(currentSeg);
            }

            try {
                const response = await fetch(`/api/session/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        words: wordsData,
                        keep_segments: newKeepSegments
                    })
                });

                if (!response.ok) throw new Error('Ошибка сохранения');

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.close();
            } catch (err) {
                tg.MainButton.hideProgress();
                tg.showAlert(`Ошибка сохранения: ${err.message}`);
            }
        }

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            const errDiv = document.getElementById('error-container');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }

        loadSession();
    </script>
</body>
</html>
